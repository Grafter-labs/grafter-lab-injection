name: secret-echoed-to-log

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  echo-fake-secret:
    runs-on: ubuntu-latest
    env:
      DEMO_SECRET: GRAFTER_MARKER_NOT_A_REAL_SECRET
    steps:
      - name: Detector fixture - secret-shaped variable in log
        run: echo "GRAFTER_MARKER secret-echoed-to-log $DEMO_SECRET"
