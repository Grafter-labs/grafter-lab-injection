name: filename-collision-download

on:
  pull_request:

permissions:
  contents: read

jobs:
  collide-download-name:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Detector fixture - two downloads target one filename
        run: |
          echo "GRAFTER_MARKER filename-collision-download"
          wget -O payload.txt "https://example.invalid/${{ github.event.pull_request.head.ref }}/payload.txt"
          wget -O payload.txt "https://example.invalid/trusted/payload.txt"
