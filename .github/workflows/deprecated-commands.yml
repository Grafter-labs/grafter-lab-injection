name: deprecated-commands

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emit-deprecated-command:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - id: marker
        name: Deprecated set-output detector fixture
        run: echo "::set-output name=marker::GRAFTER_MARKER deprecated-commands"
      - name: Marker
        run: echo "GRAFTER_MARKER deprecated-command-complete"
