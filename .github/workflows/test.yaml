name: Test Credential Log Masking
on:
    workflow_dispatch:
jobs:
    test:
      runs-on: ubuntu-latest
      permissions: {}

      env:
        OSSRH_USERNAME: dummy-user
        OSSRH_PASSWORD: dummy-password

      steps:
        - name: Start local test server
          shell: bash
          run: |
            set -euo pipefail

            python3 - <<'PY' > /tmp/test-server.log 2>&1 &
            from http.server import BaseHTTPRequestHandler, HTTPServer

            class Handler(BaseHTTPRequestHandler):
                def do_POST(self):
                    self.send_response(200)
                    self.end_headers()
                    self.wfile.write(b"dummy response")

                def log_message(self, format, *args):
                    pass

            HTTPServer(("127.0.0.1", 8765), Handler).serve_forever()
            PY

            echo $! > /tmp/test-server.pid
            sleep 1

        - name: Test verbose curl logging
          shell: bash
          run: |
            set -euo pipefail

            TOKEN=$(echo -n "${{ secrets.OSSRH_USERNAME }}:${{ secrets.OSSRH_PASSWORD }}" | base64)


            curl -v \
              -X POST \
              -H "Authorization: Bearer $TOKEN" \
              http://127.0.0.1:8765/upload

            echo "//registry.npmjs.org/:_authToken=\${OSSRH_USERNAME}" >> ~/.npmrc

        - name: Stop local test server
          if: always()
          shell: bash
          run: |
            if [ -f /tmp/test-server.pid ]; then
              kill "$(cat /tmp/test-server.pid)" || true
            fi
